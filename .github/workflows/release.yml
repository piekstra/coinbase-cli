name: release

# Cut a release by pushing a tag like `v0.1.0`. Cross-platform artifacts live
# here rather than in per-push CI, so the expensive macOS runner is billed once
# per release instead of once per commit. One Linux job and ONE macOS job
# (Apple Silicon, which cross-compiles the Intel target — the macOS SDK is
# universal). Jobs are independent (fail-fast: false) and each attaches its own
# assets, so a slow or dead macOS queue can never block the Linux assets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: apple (aarch64 + x86_64)
            targets: "aarch64-apple-darwin x86_64-apple-darwin"
          - os: ubuntu-latest
            name: linux x86_64
            targets: "x86_64-unknown-linux-gnu"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # Asset names are the contract `cbase self-update` resolves against:
      # <bin>-<target>.tar.gz plus a sibling .sha256.
      - name: Build and package each target
        run: |
          for t in ${{ matrix.targets }}; do
            rustup target add "$t"
            cargo build --release --target "$t"
            tar -C "target/$t/release" -czf "cbase-$t.tar.gz" cbase
            shasum -a 256 "cbase-$t.tar.gz" > "cbase-$t.tar.gz.sha256"
          done
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cbase-*.tar.gz
            cbase-*.tar.gz.sha256
